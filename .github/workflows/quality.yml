name: GainiRen Quality Gate
on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate source structure
        run: |
          test -f index.html
          test -f package.json
          test -f vite.config.js
          test -f src/main.jsx
          test -f src/app/App.jsx
          test -f src/components/Navigation.jsx
          test -f src/components/Dashboard.jsx
          test -f src/components/Pages.jsx
          test -f src/services/databaseAdapter.js
      - name: Build production app
        run: npm run build
      - name: Verify Vite output
        run: test -f dist/index.html
